<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="Kristoffer Strømdal Wik">
  <meta property="og:image" content="/castle.png">
  <title>Kristoffer Strømdal Wik</title>
  <meta name="description" content="Kristoffer Strømdal Wik" />
  <link rel="canonical" href="https://wwwik.no" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="alternate" type="application/rss+xml" title="Kristoffer Strømdal Wik" href="/rss.xml" />
</head>
<body>
<div class="wrap">

  <header>
    <div class="site-name"><a href="/">Kristoffer Strømdal Wik</a></div>
    <nav>
      <a href="/" class="active">About</a>
      <a href="blog.html">Writing</a>
    </nav>
  </header>

  <main>

    <!-- ── About ──────────────────────────────── -->
    <section id="about">
      <h1> <span id="greeting"></span>, I'm <span id="cv-name">Kristoffer</span>.</h1>
      <p id="cv-bio"></p>
      <div class="contact-links" id="cv-links"></div>
    </section>

    <!-- ── Recent writing ─────────────────────── -->
    <section id="recent">
      <h2>Recent writing</h2>
      <ul class="post-list" id="recent-posts">
        <li style="color:var(--muted);font-size:.88rem">Loading…</li>
      </ul>
      <p style="margin-top:1rem;">
        <a href="blog.html" style="font-size:.88rem">All posts →</a>
      </p>
    </section>

    <!-- ── CV: rendered from cv.json (edit in /admin/) ── -->
    <section id="projects">
      <h2>Projects</h2>
      <div id="cv-projects"></div>
      <p style="margin-top:1rem;">
        <a href="#" id="toggle-projects" style="font-size:.88rem; cursor:pointer; display:none;">Show more ↓</a>
      </p>
    </section>

    <section id="experience">
      <h2>Experience</h2>
      <div id="cv-experience"></div>
    </section>

    <section id="education">
      <h2>Education</h2>
      <div id="cv-education"></div>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <div class="skills" id="cv-skills"></div>
    </section>

  </main>

  <footer>
    <span>Kristoffer Strømdal Wik</span>
    <span><a href="https://wwwik.no">wwwik.no</a></span>
    <span><a href="rss.xml">RSS</a></span>
    <span><a href="/auth/login" id="signin">Sign in</a></span>
  </footer>

</div>

<script>
    // Compute greeting from time of day
  (function () {
    const timeOfDay = new Date(); 
    if (timeOfDay.getHours() <= 5) document.getElementById('greeting').textContent = "Good night";
    else if (timeOfDay.getHours() <= 9) document.getElementById('greeting').textContent = "Good morning";
    else if (timeOfDay.getHours() <= 16) document.getElementById('greeting').textContent = "Good day";
    else if (timeOfDay.getHours() <= 21) document.getElementById('greeting').textContent = "Good evening";
    else document.getElementById('greeting').textContent = "Good night";
  })();

  // Compute current age from birthdate
  function currentAge() {
    const birth = new Date(2005, 9, 3); // Oct 3 2005 (month is 0-indexed)
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    if (now < new Date(now.getFullYear(), birth.getMonth(), birth.getDate())) age--;
    return age;
  }

  // Render CV sections from cv.json (edited in /admin/)
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const entryHtml = (e) => `
    <div class="entry">
      <span class="entry-title">${e.href ? `<a href="${esc(e.href)}"${/^https?:/.test(e.href) ? ' target="_blank" rel="noopener"' : ''}>${esc(e.title)}</a>` : esc(e.title)}</span>
      <span class="entry-date">${esc(e.date)}</span>
      <span class="entry-sub">${esc(e.sub)}</span>
      ${e.desc ? `<p class="entry-desc">${esc(e.desc)}</p>` : ''}
    </div>`;
  fetch('cv.json')
    .then(r => r.json())
    .then(cv => {
      if (cv.name) document.getElementById('cv-name').textContent = cv.name;
      document.getElementById('cv-bio').innerHTML = (cv.bio || []).map(l => esc(l).replace('{age}', currentAge())).join('<br> ');
      document.getElementById('cv-links').innerHTML = (cv.links || []).map(l =>
        `<a href="${esc(l.href)}"${/^https?:/.test(l.href) ? ' target="_blank" rel="noopener"' : ''}>${esc(l.label)}</a>`).join('');
      for (const k of ['projects', 'experience', 'education']) document.getElementById('cv-' + k).innerHTML = (cv[k] || []).map(entryHtml).join('');
      document.getElementById('cv-skills').textContent = cv.skills || '';
      setupProjectToggle();
    })
    .catch(() => {});

  // Load recent posts from posts.json
  fetch('posts.json')
    .then(r => r.json())
    .then(({ posts }) => {
      const list = document.getElementById('recent-posts');
      const recent = [...posts]
        .sort((a, b) => b.date.localeCompare(a.date))
        .slice(0, 4);
      list.innerHTML = recent.map(p => `
        <li class="post-item">
          <span class="post-date">${fmtDate(p.date)}</span>
          <div class="post-body">
            <div class="post-title">
              <span class="badge badge-${p.type === 'achievement' ? 'achievement' : 'blog'}">
                ${p.type === 'achievement' ? 'Achievement' : 'Post'}
              </span>
              <a href="blog.html#${p.id}">${p.title}</a>
            </div>
            <p class="post-summary">${p.summary}</p>
          </div>
        </li>
      `).join('');
    })
    .catch(() => {
      document.getElementById('recent-posts').innerHTML =
        '<li style="color:var(--muted);font-size:.88rem">No posts yet.</li>';
    });

  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // Automatisk skjuling av prosjekter etter de 4 første
  function setupProjectToggle() {
    const projects = document.querySelectorAll('#projects .entry');
    const toggleBtn = document.getElementById('toggle-projects');
    let isHidden = true;
    if (projects.length <= 4) return;
    toggleBtn.style.display = '';
    for (let i = 4; i < projects.length; i++) projects[i].style.display = 'none';
    toggleBtn.addEventListener('click', function (e) {
      e.preventDefault();
      isHidden = !isHidden;
      for (let i = 4; i < projects.length; i++) projects[i].style.display = isHidden ? 'none' : '';
      this.textContent = isHidden ? 'Show more ↓' : 'Show less ↑';
    });
  }
</script>
<script>
  // Footer: vis "Admin" i stedet for "Sign in" hvis eier er innlogget.
  const q = new URLSearchParams(location.search);
  const toast = (msg) => {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.classList.add('show'), 20); setTimeout(() => t.classList.remove('show'), 3200); setTimeout(() => t.remove(), 3800);
  };
  if (q.has('signed-out')) toast('Signed out');
  fetch('/auth/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(m => {
    if (m && m.signedIn) {
      const a = document.getElementById('signin'); a.textContent = 'Admin'; a.href = '/admin/';
      if (q.has('signed-in')) toast('Signed in as ' + m.email);
    }
  }).catch(() => {});
  if (q.has('signed-in') || q.has('signed-out')) history.replaceState(null, '', location.pathname + location.hash);
</script>
</body>
</html>
